name: Build ad hoc IPA (Expo apps)

# Same as build-adhoc.yml, for apps made with Expo / React Native instead of XcodeGen:
# install the JavaScript packages, let Expo generate the iOS project (prebuild), then archive the workspace,
# export an Ad Hoc IPA signed in the cloud, and publish it to the install page. MidiClick's workflow is untouched.
# Needs the newer runner and Xcode that current Expo native code compiles with (macos-15's Xcode is too old).

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      scheme:
        required: true
        type: string
      bundle_id:
        required: true
        type: string
      team_id:
        required: true
        type: string
      xcode_version:
        required: false
        type: string
        default: "26.4"
    secrets:
      ASC_KEY_ID:
        required: true
      ASC_ISSUER_ID:
        required: true
      ASC_KEY_P8:
        required: true
      BUCKET_TOKEN:
        required: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
          TEAM: ${{ inputs.team_id }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_KEY_P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$BUCKET_TOKEN" ] && missing="$missing BUCKET_TOKEN"
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "These values are empty:$missing. Run add-app-secrets.bat again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Install JS dependencies
        run: npm ci

      - name: Prebuild native iOS project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform ios --non-interactive

      - name: Write App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          SCHEME: ${{ inputs.scheme }}
          TEAM: ${{ inputs.team_id }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          workspace=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n1)
          echo "Workspace: $workspace, scheme: $SCHEME"
          xcodebuild archive \
            -workspace "$workspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic

      - name: Export ad hoc IPA
        env:
          TEAM: ${{ inputs.team_id }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>ad-hoc</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>compileBitcode</key><false/>
            <key>stripSwiftSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -l "$RUNNER_TEMP/export"

      - name: Publish to bucket
        env:
          APP: ${{ inputs.app_name }}
          BUNDLE: ${{ inputs.bundle_id }}
          OWNER: ${{ github.repository_owner }}
          BUCKET_TOKEN: ${{ secrets.BUCKET_TOKEN }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          VERSION=$(unzip -p "$IPA" 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist" && /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/Info.plist")
          SLUG=$(echo "$APP" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9\n' '-')
          OWNER_LC=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          BASE="https://${OWNER_LC}.github.io/bucket"
          BUILT=$(date -u +"%Y-%m-%d %H:%M UTC")

          git clone --depth 1 "https://x-access-token:${BUCKET_TOKEN}@github.com/${OWNER}/bucket.git" "$RUNNER_TEMP/bucket"
          cd "$RUNNER_TEMP/bucket"
          mkdir -p "$SLUG"
          cp "$IPA" "$SLUG/$SLUG.ipa"

          cat > "$SLUG/manifest.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${BASE}/${SLUG}/${SLUG}.ipa</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>${BUNDLE}</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>${APP}</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF

          printf '{"name": "%s", "slug": "%s", "version": "%s", "built": "%s"}\n' \
            "$APP" "$SLUG" "$VERSION" "$BUILT" > "$SLUG/meta.json"

          BASE_URL="$BASE" python3 tools/make_index.py

          # Keep the repo small: replace history with a single fresh commit each time.
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git checkout --orphan publish
          git add -A
          git commit -q -m "Update ${APP} ${VERSION}"
          git push -f origin publish:main
